version: 2

# Плановые PR отключены: open-pull-requests-limit: 0. Обновления смотрим и делаем вручную:
#   fvm flutter pub outdated
#   (cd packages/client_api && fvm dart pub outdated)
# Security-обновления от этого лимита не зависят — они управляются в
# Settings → Code security → Dependabot security updates.
#
# Чтобы вернуть автоматические PR, достаточно убрать open-pull-requests-limit.
# Тогда они будут приходить раз в месяц и сгруппированными, а не по одному на пакет:
# - codegen — генераторы и их аннотации (freezed + freezed_annotation и т.д.)
#   обновляются только вместе, иначе версии генератора и аннотаций расходятся;
# - minor-patch — всё совместимое по semver, обычно мёржится сразу;
# - major — ломающие обновления, разбираются вручную.
updates:
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    # Требуют Dart >= 3.13, а Flutter 3.44.1 идёт с Dart 3.12. Убрать вместе с
    # обновлением Flutter, тогда же переводить freezed на 4.x сразу в обоих пакетах.
    ignore:
      - dependency-name: "freezed"
        update-types: ["version-update:semver-major"]
      - dependency-name: "freezed_annotation"
        update-types: ["version-update:semver-major"]
      - dependency-name: "very_good_analysis"
        update-types: ["version-update:semver-major"]
    groups:
      codegen:
        patterns:
          - "build_runner"
          - "freezed*"
          - "json_*"
          - "drift*"
          - "auto_route*"
          - "retrofit*"
          - "flutter_gen*"
      minor-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]

  - package-ecosystem: "pub"
    directory: "/packages/client_api"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "freezed"
        update-types: ["version-update:semver-major"]
      - dependency-name: "freezed_annotation"
        update-types: ["version-update:semver-major"]
      - dependency-name: "very_good_analysis"
        update-types: ["version-update:semver-major"]
    groups:
      codegen:
        patterns:
          - "build_runner"
          - "freezed*"
          - "json_*"
          - "retrofit*"
      minor-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
