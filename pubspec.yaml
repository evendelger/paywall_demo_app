name: paywall_demo
description: "Paywall Demo"
version: 1.0.0+1

publish_to: none

environment:
  sdk: ">=3.12.1 <4.0.0"
  flutter: 3.44.1 # точная версия, не диапазон

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  client_api:
    path: packages/client_api
  cached_network_image: ^4.0.3
  dio: ^5.9.2
  drift: ^2.33.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  mask_text_input_formatter: ^2.9.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  smooth_page_indicator: ^2.0.1
  sqlite3_flutter_libs: ^0.6.0
  stack_trace: ^1.12.1
  stream_transform: ^2.1.1
  url_launcher: ^6.3.2
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  share_plus: ^13.1.0
  collection: ^1.19.1
  # Push-уведомления: код есть в feature/notification, но не инициализируется.
  # Как включить — см. TODO в MainRunner.run()
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0
  rxdart: ^0.28.0
  pinput: ^6.0.2
  pub_semver: ^2.2.0
  bloc_concurrency: ^0.3.0
  talker_flutter: ^5.1.17
  talker_dio_logger: ^5.1.17
  talker_bloc_logger: ^5.1.17
  skeletonizer: ^2.1.3
  flutter_native_splash: ^2.4.8
  sliver_tools: ^0.2.12
  auto_route: ^11.1.0
  flutter_sticky_header: ^0.8.0
  cupertino_calendar_picker: ^2.2.6
  smooth_sheets: ^1.0.2
  dropdown_button2: ^3.1.0
  cupertino_native_better: ^1.5.0
  import_sorter: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  flutter_gen_runner: ^5.14.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  very_good_analysis: ^10.2.0
  flutter_lints: 6.0.0
  auto_route_generator: ^10.5.0

flutter_gen:
  integrations:
    flutter_svg: true
  output: lib/src/core/constant/gen
  line_length: 80

flutter:
  uses-material-design: true
  generate: true

  # iOS-плагины подключаются через Swift Package Manager. Включено на уровне
  # проекта, чтобы локальный `flutter config --no-enable-swift-package-manager`
  # не возвращал проект на CocoaPods.
  config:
    enable-swift-package-manager: true

  assets:
    - assets/images/
    - assets/icons/
  # Шрифты проекта добавляются сюда, после чего в `AppTheme`
  # проставляется `fontFamily: FontFamily.<name>`:
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: fonts/Inter/Inter-Regular.ttf
  #         weight: 400
